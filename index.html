<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sons">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Sons en directe</title>
<style>
:root{--bg:#000;--panel:#000;--line:#333;--ink:#f2efe9;--mute:#8a93a8;--amber:#ffb627;--amber-d:#c98a0a;--red:#e5636b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.player{flex:1 1 55%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 20px 12px;gap:10px}
.now{width:100%;text-align:center}
.now h1{margin:0;font-size:clamp(22px,5vw,38px);font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now p{margin:6px 0 0;color:var(--mute);font-size:clamp(14px,2.6vw,18px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{width:min(560px,100%);display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--amber)}
#play{flex:0 1 auto;width:min(60vw,46vh,340px);aspect-ratio:1;border-radius:50%;background:var(--amber);color:#1a1405;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,182,39,.12),0 14px 40px rgba(0,0,0,.45);transition:transform .08s}
#play:active{transform:scale(.96);background:var(--amber-d)}
#play svg{width:46%;height:46%}
#play.on{background:var(--ink);box-shadow:0 0 0 10px rgba(242,239,233,.12),0 14px 40px rgba(0,0,0,.45)}
.ctl{display:flex;gap:16px;align-items:center}
.ctl button{width:clamp(86px,21vw,130px);height:clamp(68px,12vh,96px);border-radius:20px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.ctl button:active{background:#222}
.ctl button:disabled{opacity:.3}
.ctl svg{width:40px;height:40px}
.list{flex:1 1 45%;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:8px}
.head b{font-size:16px}
.head div{display:flex;gap:8px}
.pill{padding:10px 16px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.pill.hl{background:var(--amber);color:#1a1405;border-color:var(--amber);font-weight:600}
ol{list-style:none;margin:0;padding:0 8px 8px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
li{display:flex;align-items:center;gap:6px;border-radius:12px}
li.cur{background:rgba(255,182,39,.14)}
li .n{width:30px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
li.cur .n{color:var(--amber)}
li .t{flex:1;text-align:left;padding:14px 6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
li .m{width:46px;height:46px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:18px}
li .m.x{color:var(--red)}
.empty{padding:28px 20px;text-align:center;color:var(--mute);line-height:1.5}
#wake{position:fixed;left:0;right:0;top:0;height:0}
@media (orientation:landscape) and (min-width:700px){
 #app{flex-direction:row}
 .player{flex:1 1 55%}
 .list{flex:1 1 45%;border-top:0;border-left:1px solid var(--line)}
 #play{width:min(40vw,60vh,320px)}
}
@media (prefers-reduced-motion:reduce){#play{transition:none}}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
 <section class="player">
  <div class="now"><h1 id="title">Cap so carregat</h1><p id="next"></p></div>
  <div class="bar"><span id="cur">0:00</span><div class="track"><i id="fill"></i></div><span id="dur">0:00</span></div>
  <button id="play" aria-label="Reproduir"></button>
  <div class="ctl">
   <button id="prev" aria-label="So anterior"></button>
   <button id="stop" aria-label="Aturar i tornar a l'inici"></button>
   <button id="nextb" aria-label="So següent"></button>
  </div>
 </section>
 <section class="list">
  <div class="head"><b id="count">Sons</b>
   <div><button class="pill" id="edit">Editar</button><button class="pill hl" id="add">+ Afegir sons</button></div>
  </div>
  <ol id="ol"></ol>
 </section>
</div>
<input type="file" id="file" accept="audio/*" multiple hidden>
<audio id="au" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id);
const au=$('au'), ICON={
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
 stop:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>',
 prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
 next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg>'};
$('prev').innerHTML=ICON.prev;$('stop').innerHTML=ICON.stop;$('nextb').innerHTML=ICON.next;

let tracks=[], cur=-1, objUrl=null, edit=false, db;

/* ---------- Emmagatzematge (IndexedDB) ---------- */
function openDB(){return new Promise((res,rej)=>{
 const r=indexedDB.open('sons-directe',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('sounds',{keyPath:'id',autoIncrement:true});
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const store=m=>db.transaction('sounds',m).objectStore('sounds');
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const saveOrder=()=>{const s=store('readwrite');tracks.forEach((t,i)=>{t.order=i;s.put(t);});};

/* ---------- Reproductor ---------- */
function fmt(s){if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function load(i){
 if(!tracks.length){cur=-1;au.removeAttribute('src');au.load();render();return;}
 i=Math.max(0,Math.min(tracks.length-1,i));
 au.pause();
 if(objUrl)URL.revokeObjectURL(objUrl);
 objUrl=URL.createObjectURL(tracks[i].blob);
 au.src=objUrl;au.load();cur=i;
 updateSession();render();
}
function toggle(){ if(cur<0)return; au.paused?au.play().catch(()=>{}):au.pause(); }
function stop(){ if(cur<0)return; au.pause(); au.currentTime=0; progress(); syncPlay(); }
function go(d){ if(cur<0)return; const n=cur+d; if(n<0||n>=tracks.length)return; load(n); }
au.addEventListener('ended',()=>{ if(cur<tracks.length-1)load(cur+1); else{au.currentTime=0;} syncPlay(); });
['play','pause','loadedmetadata','emptied'].forEach(e=>au.addEventListener(e,()=>{syncPlay();progress();}));
au.addEventListener('timeupdate',progress);
function progress(){ $('cur').textContent=fmt(au.currentTime); $('dur').textContent=fmt(au.duration);
 $('fill').style.width=(au.duration?au.currentTime/au.duration*100:0)+'%'; }
function syncPlay(){ const b=$('play'), on=!au.paused&&cur>=0;
 b.innerHTML=on?ICON.pause:ICON.play; b.classList.toggle('on',on);
 b.setAttribute('aria-label',on?'Pausar':'Reproduir'); wake(on); }

/* ---------- Pantalla encesa i controls del sistema ---------- */
let lock=null;
async function wake(on){ try{ if(on&&!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.onrelease=()=>lock=null;}
 else if(!on&&lock){await lock.release();lock=null;} }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&!au.paused)wake(true); });
function updateSession(){ if(!('mediaSession' in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:tracks[cur]?.name||''});
 const h={play:()=>au.play(),pause:()=>au.pause(),previoustrack:()=>go(-1),nexttrack:()=>go(1),stop:stop};
 for(const k in h)try{navigator.mediaSession.setActionHandler(k,h[k]);}catch(e){} }

/* ---------- Interfície ---------- */
function render(){
 const has=cur>=0;
 $('title').textContent=has?tracks[cur].name:'Cap so carregat';
 $('next').textContent=has?(tracks[cur+1]?'Següent: '+tracks[cur+1].name:'Últim so'):'Afegeix sons per començar';
 $('prev').disabled=!has||cur<=0; $('nextb').disabled=!has||cur>=tracks.length-1;
 $('stop').disabled=!has; $('play').disabled=!has; $('play').style.opacity=has?1:.35;
 $('count').textContent=tracks.length?tracks.length+(tracks.length==1?' so':' sons'):'Sons';
 $('edit').textContent=edit?'Fet':'Editar'; $('edit').classList.toggle('hl',edit);
 const ol=$('ol'); ol.innerHTML='';
 if(!tracks.length){ol.innerHTML='<div class="empty">Encara no hi ha cap so.<br>Toca «+ Afegir sons» i tria els arxius d\'àudio.</div>';syncPlay();progress();return;}
 tracks.forEach((t,i)=>{
  const li=document.createElement('li'); if(i===cur)li.className='cur';
  li.innerHTML='<span class="n">'+(i+1)+'</span>';
  const b=document.createElement('button'); b.className='t'; b.textContent=t.name;
  b.onclick=()=>edit?rename(i):load(i); li.appendChild(b);
  if(edit){ [['▲',()=>move(i,-1),i===0],['▼',()=>move(i,1),i===tracks.length-1],['✕',()=>remove(i),false]].forEach(([s,f,d],k)=>{
   const m=document.createElement('button'); m.className='m'+(k==2?' x':''); m.textContent=s; m.disabled=d; m.style.opacity=d?.3:1; m.onclick=f; li.appendChild(m); }); }
  ol.appendChild(li);
 });
 syncPlay(); progress();
 const c=ol.querySelector('.cur'); if(c&&!edit)c.scrollIntoView({block:'nearest'});
}
function move(i,d){ const j=i+d; if(j<0||j>=tracks.length)return; const id=tracks[cur]?.id;
 [tracks[i],tracks[j]]=[tracks[j],tracks[i]]; cur=tracks.findIndex(t=>t.id===id); saveOrder(); render(); }
function rename(i){ const n=prompt('Nom del so',tracks[i].name); if(n&&n.trim()){tracks[i].name=n.trim();store('readwrite').put(tracks[i]);if(i===cur)updateSession();render();} }
function remove(i){ if(!confirm('Esborrar «'+tracks[i].name+'»?'))return;
 const wasCur=i===cur, id=tracks[i].id; store('readwrite').delete(id); tracks.splice(i,1);
 if(wasCur){ load(Math.min(i,tracks.length-1)); } else { if(i<cur)cur--; render(); } saveOrder(); }

$('play').onclick=toggle; $('stop').onclick=stop; $('prev').onclick=()=>go(-1); $('nextb').onclick=()=>go(1);
$('edit').onclick=()=>{edit=!edit;render();};
$('add').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const files=[...e.target.files]; if(!files.length)return;
 const base=tracks.length;
 for(const [k,f] of files.entries()){
  const rec={name:f.name.replace(/\.[^.]+$/,''),blob:f,order:base+k};
  rec.id=await req(store('readwrite').add(rec)); tracks.push(rec);
 }
 e.target.value=''; if(cur<0)load(0); else render();
};
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();} else if(e.code==='ArrowRight')go(1); else if(e.code==='ArrowLeft')go(-1); });

(async()=>{
 try{ db=await openDB(); tracks=(await req(store('readonly').getAll())).sort((a,b)=>a.order-b.order);
  if(navigator.storage?.persist)navigator.storage.persist(); }catch(e){ tracks=[]; }
 if(tracks.length)load(0); else render();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
